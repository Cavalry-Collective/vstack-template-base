name: Deploy

# Deploy must NOT run unless CI is green. This fires only after the CI workflow
# completes successfully on a push to main; keep that dependency when filling in the TODO.
# (If you later merge CI and deploy into one workflow, replace this trigger with a
# deploy job that declares `needs: ci`.)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only on a successful CI run, and only for main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      # When filling in: check out the exact commit CI tested — a `workflow_run`
      # checkout defaults to the latest main, which can deploy a commit CI never saw.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        run: 'echo "TEMPLATE-TODO: replace with your deploy command"'
